[theme]
# Paleta clara inspirada no site de RI da Natura.
base = "light"
primaryColor = "#006B3C"              # verde institucional Natura
backgroundColor = "#FFFFFF"           # fundo principal branco
secondaryBackgroundColor = "#F4F4F4"  # sidebar / widgets em cinza-claro
textColor = "#333333"                 # texto grafite de alto contraste
font = "serif"

[server]
headless = true

[browser]
gatherUsageStats = false
